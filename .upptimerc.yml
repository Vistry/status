owner: Vistry
repo: status

sites:
  - name: Eva Insights
    url: https://insights.eva.vistry.ai
  - name: Eva People
    url: https://people.eva.vistry.ai
  - name: Eva Insights API
    url: https://api.insights.eva.vistry.ai/api/health

status-website:
  # No custom domain yet. Vistry is on GitHub Enterprise Cloud, which serves
  # private-repo Pages sites from a randomized subdomain-isolation hostname
  # (e.g. https://<random>.pages.github.io/) rather than the standard
  # org.github.io/repo path — so baseUrl must be root, not /status.
  baseUrl: /
  logoUrl: https://raw.githubusercontent.com/Vistry/status/master/assets/upptime-icon.svg
  name: Eva Status
  introTitle: "**Eva Status** — live availability for Eva Insights, Eva People, and the Eva Insights API."
  introMessage: Real-time uptime data collected every 5 minutes via GitHub Actions. Incidents open as GitHub Issues on this repository automatically.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
